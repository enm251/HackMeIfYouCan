user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Map current_lab cookie to corresponding port
    map $cookie_current_lab $lab_port {
        "a01-idor" 30001;
        "a01-privesc" 30002;
        "a01-path-traversal" 30003;
        "a02-weak-crypto" 30004;
        "a03-sqli-union" 30005;
        "a03-sqli-blind" 30006;
        "a03-cmd-injection" 30007;
        "a03-ssti" 30008;
        "a04-insecure-design" 30009;
        "a05-xxe" 30010;
        "a06-outdated-components" 30012;
        "a07-jwt-bypass" 30013;
        "a08-deserialization-python" 30014;
        "a09-log-injection" 30015;
        "a10-ssrf" 30016;
        "a01-cors" 30017;
        "a03-sqli-time" 30018;
        "a05-git" 30019;
        "a07-oauth" 30020;
        "a10-ssrf-bypass" 30021;
        "a07-brute-force" 30022;
        "a08-node-serialize" 30023;
        "a09-log-xss" 30024;
        "a03-nosql" 30025;
        "a03-ldap" 30026;
        "a03-second-order" 30027;
        "a03-xpath" 30028;
        "a03-argument-injection" 30029;
        "a08-prototype-pollution" 30030;
        "a02-jwt-confusion" 30031;
        "a06-request-smuggling" 30032;
        "a04-race-condition" 30033;
        "cybercorp-portal" 30040;
        default 3000;
    }

    server {
        listen 10000;
        server_name localhost;

        # Exact dashboard homepage routing (clears active lab cookie)
        location = / {
            add_header Set-Cookie "current_lab=; Path=/; Expires=Thu, 01 Jan 1970 00:00:01 GMT; SameSite=Lax";
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dashboard APIs routing
        location ~ ^/api/(labs|reset|proxy) {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dashboard fallback routing
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket support for Dashboard console if any
        location /ws {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        # Specific subpath proxy for a01-idor
        location /lab/a01-idor/ {
            add_header Set-Cookie "current_lab=a01-idor; Path=/; SameSite=Lax";
            proxy_pass http://127.0.0.1:30001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Specific subpath proxy for a01-privesc
        location /lab/a01-privesc/ {
            add_header Set-Cookie "current_lab=a01-privesc; Path=/; SameSite=Lax";
